<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Victron монітор</title>
<!--
  Local monitor for a Victron MultiPlus-II GX (and any GX device on Venus OS).
  No external dependencies: works without internet, needs only LAN access to the GX.

  On the GX enable: Settings → Services (newer firmware: Settings → Integrations) → MQTT
  (LAN access, plaintext). The page connects over MQTT-over-WebSocket: ws://<GX IP>:9001
  (newer Venus OS also serves ws://<GX IP>/websocket-mqtt).

  It can be hosted on the GX itself (see deploy-to-gx.ps1): then it opens as http://<GX IP>/monitor/
  from any phone/tablet and connects to that GX by itself.

  Quick start: victron-monitor.html?host=192.168.1.50   or   victron-monitor.html?demo=1
  Wall mode (tablet): add &wall=1, e.g. victron-monitor.html?host=192.168.1.50&wall=1
-->
<style>
:root{
  --bg:#0e1317;--card:#161e25;--line:#25313c;--fg:#e6edf3;--mut:#8b98a5;
  --ok:#3fb950;--warn:#d29922;--bad:#f85149;--chg:#3fb950;--dis:#f0883e;--acc:#58a6ff;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg)}
body{font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh}
header{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.brand{font-weight:600;font-size:17px}
.conn{display:flex;align-items:center;gap:8px;color:var(--mut);font-size:13px}
.dot{width:10px;height:10px;border-radius:50%;background:var(--mut);flex:none}
.conn.ok .dot{background:var(--ok)} .conn.wait .dot{background:var(--warn)} .conn.bad .dot{background:var(--bad)}
.sp{flex:1}
button{background:#21303d;color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:7px 12px;font:inherit;cursor:pointer}
button:hover{border-color:var(--acc)}
button.pri{background:var(--acc);color:#04111f;border-color:var(--acc);font-weight:600}
.langsel{background:#21303d;color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:6px 8px;font:inherit;cursor:pointer}
main{max-width:1200px;margin:0 auto;padding:16px;display:grid;gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;min-width:0}
.lbl{color:var(--mut);font-size:13px;text-transform:uppercase;letter-spacing:.04em}
.big{font-size:44px;font-weight:650;font-variant-numeric:tabular-nums;line-height:1.15;margin:6px 0 4px;white-space:nowrap}
.mid{font-size:28px;font-weight:600;font-variant-numeric:tabular-nums;margin:4px 0 2px;white-space:nowrap}
.sub{color:var(--mut);font-size:13px;min-height:1.4em}
.hero{display:grid;grid-template-columns:1fr 1.4fr;gap:16px}
.etaf .big,#soc{white-space:normal}
.etaf .big>span,#soc>span{white-space:nowrap;display:inline-block}
.rate{font-size:.45em;font-weight:500;opacity:.85;margin-left:.35em}
.etaf.chg .big{color:var(--chg)} .etaf.dis .big{color:var(--dis)}
.etaf.dis{border-top:1px solid var(--line);margin-top:10px;padding-top:10px}
.etaf.fc{opacity:.6}                                 /* the "what if" forecast is dimmed */
.etacard.chg{border-color:var(--chg)} .etacard.dis{border-color:var(--dis)}
.bar{position:relative;height:12px;border-radius:6px;background:#0b1014;border:1px solid var(--line);overflow:hidden;margin:8px 0 6px}
#socBar{height:100%;width:0;background:var(--ok);transition:width .6s,background .6s}
#invBar,#gridBar{height:100%;width:0;background:var(--ok);transition:width .6s,background .6s}
#gridLoad:empty{display:none}
.tile.hot{border-color:var(--bad)}
#resMark{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--bad);left:0;display:none}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:16px}
.tile.bad{border-color:var(--bad)} .tile.bad .mid{color:var(--bad)}
.tile.good .mid{color:var(--ok)}
canvas{width:100%;height:180px;display:block;margin-top:8px}
.legend{display:flex;gap:16px;color:var(--mut);font-size:12px;margin-top:6px;flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
.note{color:var(--mut);font-size:12px;margin:0}
dialog{background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:14px;padding:20px;width:min(520px,calc(100vw - 32px))}
dialog::backdrop{background:#0009}
dialog h2{margin:0 0 12px;font-size:18px}
.f{display:grid;gap:4px;margin-bottom:12px}
.f label{font-size:13px;color:var(--mut)}
.f input{background:#0b1014;color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font:inherit;width:100%}
.f small{color:var(--mut);font-size:12px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.btns{display:flex;gap:8px;justify-content:flex-end;margin-top:8px}
.ctlrow{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.ctlrow input{width:90px;flex:0 0 auto}
.ctlrow .pri{margin-left:auto}
.warnt{color:var(--warn)} .warnt:empty{display:none}
.ctlst{min-height:1.4em;font-size:14px;margin:4px 0}
.ctlst.ok{color:var(--ok)} .ctlst.bad{color:var(--bad)}
.etarow{display:flex;gap:14px;align-items:center}
.etamain{flex:1;min-width:0}
.qcols{display:flex;gap:8px;flex:0 0 auto}
.qbtns{display:flex;flex-direction:column;gap:6px;align-items:stretch;flex:0 0 auto}
.qbtns .qlbl{color:var(--mut);font-size:12px;text-align:center;text-transform:uppercase;letter-spacing:.04em}
.qbtns button{min-width:72px;font-size:16px;font-weight:600;padding:8px 10px}
.qbtns button.on{background:var(--chg);color:#04111f;border-color:var(--chg)}
.qbtns button:disabled{opacity:.6;cursor:wait}
#qStatus.ok{color:var(--ok)} #qStatus.bad{color:var(--bad)}
body.wall .qbtns .qlbl{font-size:clamp(13px,1.6vw,24px)}
body.wall .qbtns{gap:1.2vh}
body.wall .qbtns button{font-size:clamp(16px,2.2vw,34px);padding:1.4vh 1.4vw;min-width:7vw}
@media (max-width:820px){.hero{grid-template-columns:1fr}.big{font-size:38px}}
/* phone: buttons below the text, in two rows "INPUT 10 13 16" / "CHARGE 20 28 35" (ascending left to right) */
@media (max-width:560px){
  body:not(.wall) .etarow{flex-direction:column;align-items:stretch}
  body:not(.wall) .qcols{flex-direction:column;gap:6px}
  body:not(.wall) .qbtns{flex-direction:row-reverse;align-items:center}
  body:not(.wall) .qbtns .qlbl{order:99;width:56px;text-align:left}
  body:not(.wall) .qbtns button{flex:1;min-width:0}
  body:not(.wall) .etaf .big>.rate{display:block;margin-left:0}
}
[hidden]{display:none!important}
dialog{max-height:calc(100vh - 32px);overflow:auto}
dialog h3{font-size:15px;margin:18px 0 10px;padding-top:14px;border-top:1px solid var(--line)}
.chk{display:flex;align-items:center;gap:8px;margin-bottom:10px;font-size:14px;cursor:pointer}
.chk input{width:18px;height:18px;accent-color:var(--acc)}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.clock{display:none;font-weight:600;font-variant-numeric:tabular-nums}
.wallonly{display:none}
.wl{font-size:18px}
#flash{position:fixed;inset:0;pointer-events:none;opacity:0;z-index:50}
#flash.on{animation:fl 2.6s ease-out}
@keyframes fl{0%{opacity:.6}16%{opacity:0}33%{opacity:.6}50%{opacity:0}66%{opacity:.6}100%{opacity:0}}
#toast{position:fixed;left:50%;top:16px;transform:translateX(-50%);background:var(--card);border:2px solid var(--acc);border-radius:12px;
  padding:12px 20px;font-size:18px;font-weight:600;z-index:60;max-width:calc(100vw - 32px);box-shadow:0 8px 30px #000a;cursor:pointer}

/* ---------- Wall mode ---------- */
body.wall{display:flex;flex-direction:column;height:100vh;overflow:hidden}
body.wall header{border-bottom:0;padding:1.5vh 2vw}
body.wall .brand,body.wall .normalonly{display:none}
body.wall .wallonly{display:inline-block}
body.wall .clock{display:block;font-size:clamp(22px,4vw,60px)}
body.wall .conn{font-size:clamp(13px,1.5vw,20px)}
body.wall main{flex:1;min-height:0;width:100%;max-width:none;padding:0 2vw 2vh;grid-template-rows:minmax(0,1fr) auto}
body.wall .hero{grid-template-columns:1fr 1.35fr;min-height:0}
body.wall .hero .card{display:flex;flex-direction:column;justify-content:center;padding:2vh 2.5vw;min-height:0}
body.wall .lbl{font-size:clamp(13px,1.8vw,26px)}
body.wall .sub{font-size:clamp(13px,1.6vw,24px)}
body.wall #soc{font-size:clamp(48px,min(12vw,22vh),220px)}
body.wall #tDis,body.wall #tChg{font-size:clamp(28px,min(4.4vw,7vh),100px);margin:.05em 0}
body.wall .etaf .lbl{font-size:clamp(12px,1.5vw,22px)}
/* on the wall the bracket (power · %/h) always goes on its own line and captions stay on one line: the card height is predictable in any language */
body.wall .etaf .big>.rate{display:block;margin:0;font-size:.42em}
body.wall .etaf .sub{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
body.wall .etaf.dis{margin-top:1.2vh;padding-top:1.2vh}
body.wall #soc>.rate{display:block;margin:0 0 .1em;font-size:.3em}
body.wall .bar{height:clamp(12px,2.5vh,30px);border-radius:15px}
body.wall .tiles{grid-template-columns:2fr 1fr}
body.wall .tiles>:not(.wallkeep),body.wall .chartcard,body.wall .note{display:none}
body.wall .mid{font-size:clamp(26px,4.6vw,80px)}
body.wall #toast{font-size:clamp(18px,3vw,44px);top:3vh;padding:2vh 3vw}
@media (orientation:portrait){
  body.wall .hero{grid-template-columns:1fr;grid-auto-rows:1fr}
  body.wall #soc{font-size:clamp(48px,min(18vw,13vh),220px)}
  body.wall #tDis,body.wall #tChg{font-size:clamp(32px,min(9vw,6.5vh),120px)}
}
body.night header,body.night main{filter:brightness(var(--dim,.3))}

/* ---------- Survival calculator (right column; below the dashboard on narrow screens, hidden in wall mode) ---------- */
.layout{max-width:1560px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr) 340px;align-items:start}
.layout>main{max-width:none;margin:0;width:100%}
#surv{margin:16px 16px 16px 0;display:grid;gap:8px}
@media (max-width:1100px){.layout{grid-template-columns:minmax(0,1fr)}#surv{margin:0 16px 16px}}
body.wall .layout{display:contents} body.wall #surv{display:none}
.survhd{display:flex;align-items:center;gap:8px}
.survhd .lbl{flex:1}
.survhd button{padding:4px 10px;font-size:13px}
.survsum{font-weight:600;font-size:15px}
.survsum.ok{color:var(--ok)} .survsum.warn{color:var(--warn)} .survsum.bad{color:var(--bad)}
.survgrid{display:grid;grid-template-columns:30px repeat(3,minmax(0,1fr));gap:3px;user-select:none;-webkit-user-select:none;font-variant-numeric:tabular-nums}
.svh{color:var(--mut);font-size:12px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-bottom:2px}
.svhr{color:var(--mut);font-size:11px;text-align:right;padding-right:4px;line-height:22px}
.svc{height:22px;border-radius:4px;background:#0b1014;border:1px solid var(--line);font-size:12px;line-height:20px;text-align:center;cursor:pointer;touch-action:manipulation}
.svc:hover{border-color:var(--acc)}
.svc.ok{background-color:rgba(63,185,80,.32)} .svc.warn{background-color:rgba(210,153,34,.38)} .svc.bad{background-color:rgba(248,81,73,.42)}
.svc.off{background-image:repeating-linear-gradient(135deg,rgba(0,0,0,.55) 0 4px,transparent 4px 9px);font-weight:600}
.svc.past{opacity:.3;cursor:default}
.svc.past:hover{border-color:var(--line)}
.svc.cur{border:2px solid var(--acc);line-height:18px}
.legend i.sv-ok{background:rgba(63,185,80,.7)} .legend i.sv-warn{background:rgba(210,153,34,.8)} .legend i.sv-bad{background:rgba(248,81,73,.8)}
.legend i.sv-off{background:#0b1014 repeating-linear-gradient(135deg,var(--mut) 0 2px,transparent 2px 4px)}
</style>
</head>
<body>
<!-- UI texts live in the TR table (script below), in two languages. Only the keys are here:
     data-i — element text, data-it — tooltip (title), data-ip — placeholder. -->
<header>
  <div class="brand" data-i="brand"></div>
  <div class="clock" id="clock"></div>
  <div id="conn" class="conn"><span class="dot"></span><span id="connText">—</span></div>
  <div class="sp"></div>
  <span id="wl" class="wl" data-it="wlTitle" hidden>🔆</span>
  <button id="sndBadge" data-i="sndOn" data-it="sndTitle" hidden></button>
  <button id="btnDemo" class="normalonly"></button>
  <button id="btnWall"></button>
  <button id="btnFs" class="wallonly" data-it="fsTitle">⛶</button>
  <button id="btnCtl" data-it="ctlTitle"></button>
  <button id="btnCfg" data-i="settingsBtn"></button>
  <select id="selLang" class="langsel" title="Мова · Language">
    <option value="uk">UA</option><option value="en">EN</option>
  </select>
</header>

<div class="layout">
<main>
  <section class="hero">
    <div class="card">
      <div class="lbl" data-i="socLbl"></div>
      <div class="big" id="soc">—</div>
      <div class="bar"><div id="socBar"></div><div id="resMark" data-it="reserveWord"></div></div>
      <div class="sub" id="socSub"></div>
    </div>
    <!-- one card: charge on top (green), discharge below (orange); whatever is happening now is bright,
         the other one is a forecast "if the grid comes back / goes down". On the right, quick buttons for the input and charge current. -->
    <div class="card etacard" id="cardEta">
      <div class="etarow">
        <div class="etamain">
          <div class="etaf chg" id="fChg">
            <div class="lbl" data-i="toFull"></div>
            <div class="big" id="tChg">—</div>
            <div class="sub" id="tChgSub"></div>
          </div>
          <div class="etaf dis" id="fDis">
            <div class="lbl"><span data-i="toEmpty"></span> <span id="disTo"></span></div>
            <div class="big" id="tDis">—</div>
            <div class="sub" id="tDisSub"></div>
          </div>
          <div class="sub" id="qStatus"></div>
        </div>
        <div class="qcols">
          <div class="qbtns" data-it="qInTitle">
            <span class="qlbl" data-i="qIn"></span>
            <button type="button" data-q="16"></button><button type="button" data-q="13"></button><button type="button" data-q="10"></button>
          </div>
          <div class="qbtns" data-it="qChgTitle">
            <span class="qlbl" data-i="qChg"></span>
            <button type="button" data-qc="35"></button><button type="button" data-qc="28"></button><button type="button" data-qc="20"></button>
          </div>
        </div>
      </div>
    </div>
  </section>

  <section class="tiles">
    <div class="card tile wallkeep" id="tGrid"><div class="lbl" data-i="gridLbl"></div><div class="mid" id="grid">—</div><div class="bar" id="gridBarBox" hidden><div id="gridBar"></div></div><div class="sub" id="gridLoad"></div><div class="sub" id="gridSub"></div></div>
    <div class="card tile wallkeep"><div class="lbl" data-i="loadLbl"></div><div class="mid" id="load">—</div><div class="bar" id="invBarBox" hidden><div id="invBar"></div></div><div class="sub" id="loadSub"></div></div>
    <div class="card tile"><div class="lbl" data-i="batLbl"></div><div class="mid" id="bat">—</div><div class="sub" id="batSub"></div></div>
    <div class="card tile"><div class="lbl" data-i="modeLbl"></div><div class="mid" id="state" style="font-size:20px;white-space:normal;overflow-wrap:anywhere">—</div><div class="sub" id="stateSub"></div></div>
  </section>

  <section class="card chartcard">
    <div class="lbl" data-i="chartLbl"></div>
    <canvas id="chart"></canvas>
    <div class="legend">
      <span><i style="background:var(--chg)"></i><span data-i="lgChg"></span></span>
      <span><i style="background:var(--dis)"></i><span data-i="lgDis"></span></span>
      <span><i style="background:var(--acc)"></i><span data-i="lgLoad"></span></span>
    </div>
  </section>

  <p class="note" data-i="note"></p>
</main>

<!-- Survival calculator: a 3-day grid schedule (hours down, days across). A click marks an outage hour;
     the battery SoC at the end of every hour is simulated from the charge / discharge rates of the forecast card. -->
<aside class="card" id="surv">
  <div class="survhd"><div class="lbl" data-i="survTitle"></div><button type="button" id="survClr" data-i="survClear"></button></div>
  <div class="survsum" id="survSum">—</div>
  <div class="sub" id="survRates"></div>
  <div class="survgrid" id="survGrid"></div>
  <div class="legend">
    <span><i class="sv-ok"></i>&gt; 60 %</span><span><i class="sv-warn"></i>40–60 %</span><span><i class="sv-bad"></i>&lt; 40 %</span>
    <span><i class="sv-off"></i><span data-i="survOff"></span></span>
  </div>
  <p class="note" data-i="survHint"></p>
</aside>
</div>

<dialog id="dlg">
  <form method="dialog" id="frm">
    <h2 data-i="settingsTitle"></h2>
    <div class="f">
      <label for="fUrl" data-i="fUrl"></label>
      <input id="fUrl" placeholder="ws://192.168.1.50:9001">
      <small data-i="fUrlHint"></small>
    </div>
    <div class="f">
      <label for="fPortal" data-i="fPortal"></label>
      <input id="fPortal" data-ip="fPortalPh">
    </div>
    <div class="row2">
      <div class="f"><label for="fUser" data-i="fUser"></label><input id="fUser" autocomplete="off"></div>
      <div class="f"><label for="fPw" data-i="fPw"></label><input id="fPw" type="password" autocomplete="off"><small data-i="fPwHint"></small></div>
    </div>
    <div class="row2">
      <div class="f"><label for="fCap" data-i="fCap"></label><input id="fCap" type="number" min="0" step="1" data-ip="fCapPh"><small data-i="fCapHint"></small></div>
      <div class="f"><label for="fRes" data-i="fRes"></label><input id="fRes" type="number" min="0" max="100" step="1" data-ip="fResPh"><small data-i="fResHint"></small></div>
    </div>
    <div class="row2">
      <div class="f"><label for="fChgW" data-i="fChgW"></label><input id="fChgW" type="number" min="0" step="50" data-ip="fChgWPh"><small data-i="fChgWHint"></small></div>
      <div class="f"><label for="fTau" data-i="fTau"></label><input id="fTau" type="number" min="1" step="1"><small data-i="fTauHint"></small></div>
    </div>
    <div class="f"><label for="fGridW" data-i="fGridW"></label><input id="fGridW" type="number" min="100" step="50" placeholder="3500"><small data-i="fGridWHint"></small></div>

    <h3 data-i="quickTitle"></h3>
    <div class="row2">
      <div class="f"><label for="fQInMin" data-i="fQInMin"></label><input id="fQInMin" type="number" min="1" max="50" step="0.5" placeholder="10"></div>
      <div class="f"><label for="fQInMax" data-i="fQInMax"></label><input id="fQInMax" type="number" min="1" max="50" step="0.5" placeholder="16"></div>
    </div>
    <div class="row2">
      <div class="f"><label for="fQChgMin" data-i="fQChgMin"></label><input id="fQChgMin" type="number" min="0" max="500" step="1" placeholder="20"></div>
      <div class="f"><label for="fQChgMax" data-i="fQChgMax"></label><input id="fQChgMax" type="number" min="0" max="500" step="1" placeholder="35"></div>
    </div>
    <div class="f"><small data-i="quickHint"></small></div>

    <h3 data-i="wallTitle"></h3>
    <label class="chk"><input type="checkbox" id="fWall"> <span data-i="fWall"></span></label>
    <label class="chk"><input type="checkbox" id="fSnd"> <span data-i="fSnd"></span></label>
    <label class="chk"><input type="checkbox" id="fQuiet"> <span data-i="fQuiet"></span></label>
    <div class="f"><label for="fLow" data-i="fLow"></label><input id="fLow" type="number" min="0" max="100" step="1" data-ip="fLowPh"></div>
    <div class="row3">
      <div class="f"><label for="fNf" data-i="fNf"></label><input id="fNf" type="number" min="0" max="23" step="1"></div>
      <div class="f"><label for="fNt" data-i="fNt"></label><input id="fNt" type="number" min="0" max="23" step="1"></div>
      <div class="f"><label for="fNd" data-i="fNd"></label><input id="fNd" type="number" min="5" max="100" step="5"></div>
    </div>
    <div class="f"><small data-i="nightHint"></small></div>
    <button type="button" id="btnTest" data-i="testSnd"></button>
    <div class="btns"><button value="cancel" formnovalidate data-i="cancel"></button><button value="ok" class="pri" data-i="saveConnect"></button></div>
  </form>
</dialog>
<dialog id="ctl">
  <form method="dialog">
    <h2 data-i="ctlH"></h2>
    <div class="f">
      <label for="cIn"><span data-i="cInLbl"></span> · <b id="cInNow">—</b></label>
      <div class="ctlrow">
        <input id="cIn" type="number" min="1" max="50" step="0.5">
        <button type="button" data-in="6">6</button><button type="button" data-in="10">10</button>
        <button type="button" data-in="13">13</button><button type="button" data-in="16">16</button>

<script>
'use strict';

/* ---------- Minimal MQTT 3.1.1 client over WebSocket (QoS 0) ---------- */
class MiniMqtt {
  constructor(url, opts) { this.url = url; this.opts = opts || {}; this.buf = new Uint8Array(0); this.pid = 1; }
  connect() {
    const ws = this.ws = new WebSocket(this.url, ['mqtt']);
    ws.binaryType = 'arraybuffer';
    ws.onopen = () => this._sendConnect();
    ws.onmessage = e => this._onData(new Uint8Array(e.data));
    ws.onclose = () => { clearInterval(this.ping); if (!this.closing) this.onstate && this.onstate('closed'); };
    ws.onerror = () => {};
  }
  close() { this.closing = true; clearInterval(this.ping); try { this.ws.close(); } catch (e) {} }
  _str(s) { const b = new TextEncoder().encode(s); const o = new Uint8Array(b.length + 2); o[0] = b.length >> 8; o[1] = b.length & 255; o.set(b, 2); return o; }
  _pkt(type, parts) {
    const len = parts.reduce((a, p) => a + p.length, 0);
    const hdr = [type]; let x = len;
    do { let d = x % 128; x = Math.floor(x / 128); if (x > 0) d |= 128; hdr.push(d); } while (x > 0);
    const out = new Uint8Array(hdr.length + len); out.set(hdr, 0);
    let o = hdr.length; for (const p of parts) { out.set(p, o); o += p.length; }
    if (this.ws && this.ws.readyState === 1) this.ws.send(out);
  }
  _sendConnect() {
    const o = this.opts; let flags = 0x02; const payload = [this._str(o.clientId)];
    if (o.username || o.password) { flags |= 0x80; payload.push(this._str(o.username || '')); }
    if (o.password) { flags |= 0x40; payload.push(this._str(o.password)); }
    this._pkt(0x10, [new Uint8Array([0, 4, 77, 81, 84, 84, 4, flags, 0, 60]), ...payload]);
  }
  subscribe(topics) {
    const id = (this.pid++ & 0xffff) || 1;
    const parts = [new Uint8Array([id >> 8, id & 255])];
    for (const t of topics) parts.push(this._str(t), new Uint8Array([0]));
    this._pkt(0x82, parts);
  }
  publish(topic, msg) { this._pkt(0x30, [this._str(topic), new TextEncoder().encode(msg || '')]); }
  _onData(chunk) {
    const b = new Uint8Array(this.buf.length + chunk.length); b.set(this.buf); b.set(chunk, this.buf.length);
    let pos = 0;
    for (;;) {
      if (b.length - pos < 2) break;
      let mul = 1, len = 0, i = pos + 1, d, ok = true;
      do { if (i >= b.length) { ok = false; break; } d = b[i++]; len += (d & 127) * mul; mul *= 128; } while (d & 128);
      if (!ok || i + len > b.length) break;
      this._handle(b[pos], b.subarray(i, i + len)); pos = i + len;
    }
    this.buf = b.slice(pos);
  }
  _handle(h, body) {
    const type = h >> 4;
    if (type === 2) {
      if (body[1] === 0) {
        this.ping = setInterval(() => { try { this.ws.send(new Uint8Array([0xC0, 0])); } catch (e) {} }, 30000);
        this.onstate && this.onstate('connected');
      } else this.onstate && this.onstate('refused', body[1]);
    } else if (type === 3) {
      const qos = (h >> 1) & 3, tl = (body[0] << 8) | body[1];
      const topic = new TextDecoder().decode(body.subarray(2, 2 + tl));
      let p = 2 + tl;
      if (qos > 0) { const a = body[p], c = body[p + 1]; p += 2; if (qos === 1) this.ws.send(new Uint8Array([0x40, 2, a, c])); }
      this.onmessage && this.onmessage(topic, new TextDecoder().decode(body.subarray(p)));
    }
  }
}

    return L.protocol === 'https:' ? ['wss://' + L.host + '/websocket-mqtt']

function start(keepHist) {
  stop(keepHist === true);

  $('btnDemo').textContent = cfg.demo ? t('demoExit') : t('demo');
  if (cfg.demo) { startDemo(); return; }
  const urls = urlList();
  const idx = urlTry % urls.length, url = urls[idx];
  urlTry = idx + 1;
  setConn('wait', () => t('connecting', { u: url }));
  let m;

    m = mq = new MiniMqtt(url, { clientId: 'webmon-' + Math.random().toString(16).slice(2, 10), username: cfg.user, password: sessionPw });
  } catch (e) { setConn('bad', () => t('badUrl', { u: url })); return; }
  m.onstate = (s, code) => {

      if (cfg.portal) usePortal(cfg.portal.trim());

    } else if (s === 'refused') {

    `N/${id}/vebus/+/Ac/Out/P`,                       // inverter output power

    `N/${id}/vebus/+/Alarms/Overload`,                // 0 ok, 1 warning, 2 overload

// The current the GX will charge the battery with from the grid: the tightest of the limits it publishes itself.

function chargeLimit(load) {

  const rm = $('resMark'); rm.style.display = reserve > 0 ? 'block' : 'none'; rm.style.left = reserve + '%';

  SV.why = mode === 'none' ? t('noData') : !capAh ? t('setCap') : '';

    // the GX publishes (DVCC, BMS, charger, ESS, input minus load); if there are none, 1500 W

    if (+cfg.chgPw > 0) { fcA = +cfg.chgPw / NOM_V; why = t('whySettings'); }
    else if (L) { fcA = L.a; why = L.why; }
    else { fcA = 1500 / NOM_V; why = t('whyNone'); }
    // expected discharge power without the grid: inverter efficiency ~92 % + ~20 W for the MultiPlus itself
    const fcW = emaL == null ? null : Math.max(0, emaL) / 0.92 + 20;
    // the same rates the card shows, in %/h: actual while it is happening, otherwise the forecast
    SV.chg = (mode === 'chg' && soc < 99.5 ? emaI : fcA < 0.5 ? 0 : fcA) / capAh * 100;
    SV.dis = mode === 'dis' ? -emaI / capAh * 100 : fcW != null ? fcW / NOM_V / capAh * 100 : null;
    // --- charge ---
    if (soc >= 99.5) { chg = t('full'); chgSub = mode === 'chg' ? t('topping') : t('charged'); }
    else if (mode === 'chg') {
      const h = capAh * (100 - soc) / 100 / emaI;
      chg = fmtDur(h); chgRate = (emaP != null ? fmtW(emaP) + ' · ' : '') + pctH(emaI, capAh);
      chgSub = fmtAt(h) + (cfg.wall ? '' : ' · ' + t('chgCur', { a: amp(emaI) }));
    } else {
      chgFc = true;
      const A = fcA;
      if (A < 0.5) { chg = t('blocked'); chgSub = t('chgBlocked', { why }); }
      else {
        const h = capAh * (100 - soc) / 100 / A;
        chg = fmtDur(h); chgRate = fmtW(A * NOM_V) + ' · ' + pctH(A, capAh);
        chgSub = `${fmtAt(h)} · ${src === 240 ? t('ifGridBack') : t('forecast')}` + (cfg.wall ? '' : ' · ' + why);
      }
    }
    // --- discharge ---
    if (soc <= reserve) { dis = t('reserveVal'); disSub = t('atReserve'); disFc = mode !== 'dis'; }
    else if (mode === 'dis') {
      const h = capAh * (soc - reserve) / 100 / -emaI;
      dis = fmtDur(h); disRate = (emaP != null ? fmtW(-emaP) + ' · ' : '') + pctH(-emaI, capAh);
      disSub = fmtAt(h) + (cfg.wall ? '' : ' · ' + t('disCur', { a: amp(-emaI) }));
    } else if (fcW != null) {
      disFc = true;
      const w = fcW, h = capAh * (soc - reserve) / 100 * NOM_V / w;
      dis = fmtDur(h); disRate = fmtW(w) + ' · ' + pctH(w / NOM_V, capAh);
      disSub = `${fmtAt(h)} · ${src === 240 ? t('forecast') : t('ifGridDrops')}` + (cfg.wall ? '' : ' · ' + t('loadW', { w: fmtW(emaL) }));
    }
  }
  // time in big type + power and %/h smaller in brackets; the "what if" forecast is dimmed
  setBig($('tChg'), chg, chgRate); $('tChgSub').textContent = chgSub; $('fChg').classList.toggle('fc', chgFc);
  setBig($('tDis'), dis, disRate); $('tDisSub').textContent = disSub; $('fDis').classList.toggle('fc', disFc);
  $('cardEta').className = 'card etacard ' + (mode === 'chg' || mode === 'dis' ? mode : '');

  // grid: events and outage log
  const gridOk = (src == null || src === 0) ? null : src !== 240;
  if (gridOk !== null) {
    if (!gridOk && !OUT.lostAt) { OUT.lostAt = now; OUT.approx = prevGrid === null; saveOut(); }
    if (gridOk && OUT.lostAt) {
      OUT.lastDur = now - OUT.lostAt; OUT.lastEnd = now; OUT.lastApprox = !!OUT.approx || prevGrid === null;
      delete OUT.lostAt; delete OUT.approx; saveOut();
    }
    if (prevGrid !== null && gridOk !== prevGrid) {
      if (gridOk) { const d = OUT.lastDur ? outDur(OUT.lastDur, OUT.lastApprox) : ''; alertEv('restore', d ? t('outLasted', { d }) : ''); }
      else alertEv('lost', t('atTime', { t: hhmm(now) }) + (soc != null ? ` · SoC ${Math.round(soc)} %` : ''));
    }
    prevGrid = gridOk;
  }

  // battery running low / at the reserve
  const lowTh = (cfg.lowSoc !== '' && cfg.lowSoc != null && isFinite(+cfg.lowSoc)) ? +cfg.lowSoc : reserve + 10;
  if (soc != null) {
    if (mode === 'dis' && resArmed && reserve > 0 && soc <= reserve + 0.5) { resArmed = lowArmed = false; alertEv('reserve', `SoC ${Math.round(soc)} %`); }
    else if (mode === 'dis' && lowArmed && soc <= lowTh) { lowArmed = false; alertEv('low', `SoC ${Math.round(soc)} %` + (dis !== '—' ? t('lowToEmpty', { d: dis }) : '')); }
    if (soc > lowTh + 3) lowArmed = true;
    if (soc > reserve + 3) resArmed = true;
  }

  // tiles
  const noGrid = gridOk === false;
  $('tGrid').className = 'card tile wallkeep ' + (noGrid ? 'bad' : gridOk ? 'good' : '');
  $('grid').textContent = cfg.wall ? (noGrid ? t('noGridWall') : gridOk ? t('gridWall') : '—') : (noGrid ? t('noGridShort') : fmtW(grid));
  let gs = '';
  if (noGrid) {
    if (OUT.lostAt) {
      const d = outDur(now - OUT.lostAt, OUT.approx);
      gs = (d ? t('noGridFor', { d }) : t('onBattery')) + ' · ' + t(OUT.approx ? 'noticedAt' : 'since', { t: hhmm(OUT.lostAt) });
    } else gs = t('onBattery');
  } else if (gridOk) {
    gs = (cfg.wall ? fmtW(grid) + ' · ' : '') + t('inputSrc', { s: SOURCES[src] ? SOURCES[src][LI] : src }) + (grid != null && grid < -20 ? ' · ' + t('exporting') : '');
    const d = OUT.lastEnd ? outDur(OUT.lastDur, OUT.lastApprox) : '';
    if (d) gs += ' · ' + t('lastOutage', { d, t: hhmm(OUT.lastEnd) });
  }
  $('gridSub').textContent = gs;
  // grid input load: power from the grid / allowed input power (a setting, default 16 A × 230 V ≈ 3500 W)
  const gridCap = +cfg.gridW > 0 ? +cfg.gridW : 3500;
  let glvl = '';
  if (gridOk && grid != null) {
    const pct = Math.max(0, grid / gridCap * 100);
    glvl = zone(pct);
    $('gridBar').style.width = Math.min(100, pct) + '%';
    $('gridBar').style.background = `var(--${glvl})`;
    $('gridLoad').textContent = t('gridLoadTxt', { p: Math.round(pct), c: fmtKw(gridCap) }) + (pct >= 100 ? t('exceeded') : '');
  } else $('gridLoad').textContent = '';
  $('gridBarBox').hidden = !glvl;
  $('tGrid').classList.toggle('hot', glvl === 'bad');

  // wall mode: clock, night, screen, sound
  $('clock').textContent = new Date().toLocaleTimeString(LOC(), { hour: '2-digit', minute: '2-digit' });
  document.documentElement.style.setProperty('--dim', Math.max(5, Math.min(100, +cfg.nightDim || 30)) / 100);
  document.body.classList.toggle('night', !!cfg.wall && isNightHour() && now > nightWakeUntil);
  keepAwake();
  $('wl').hidden = !(cfg.wall && wakeLock);
  $('sndBadge').hidden = !(cfg.snd && (!actx || actx.state !== 'running'));
  $('load').textContent = fmtW(load);
  // inverter load level: output power / its continuous rating (taken from the GX itself)
  const vi = vebusInst();
  const nom = vi == null ? null : num(S[`vebus/${vi}/Ac/Out/NominalInverterPower`]);
  const outP = (vi == null ? null : num(S[`vebus/${vi}/Ac/Out/P`])) ?? load;
  const ovl = vi == null ? null : num(S[`vebus/${vi}/Alarms/Overload`]);
  let ls = t('acOut'), lvl = '';
  if (nom > 0 && outP != null) {
    const pct = Math.max(0, outP / nom * 100), nomT = fmtKw(nom);
    ls = t(gridOk === false ? 'invLoadBat' : 'invLoadGrid', { p: Math.round(pct), n: nomT });
    lvl = ovl === 2 ? 'bad' : ovl === 1 && zone(pct) !== 'bad' ? 'dis' : zone(pct);
    if (ovl === 2) ls = t('overload') + ls; else if (ovl === 1) ls = t('nearOverload') + ls;
    $('invBar').style.width = Math.min(100, pct) + '%';
    $('invBar').style.background = `var(--${lvl})`;
  }
  $('invBarBox').hidden = !lvl;
  $('load').parentElement.classList.toggle('bad', lvl === 'bad');
  $('loadSub').textContent = ls;
  $('bat').textContent = fmtW(P);
  $('batSub').textContent = [vb, I != null ? amp(I) : '', T != null ? T.toFixed(0) + ' °C' : ''].filter(Boolean).join(' · ');
  $('state').textContent = st == null ? '—' : (STATES[st] ? STATES[st][LI] : t('stateCode', { c: st }));

  // history
  if (now - lastHist >= 5000 && (P != null || load != null)) {
    lastHist = now; hist.push({ t: now, p: P, c: load });
    while (hist.length && hist[0].t < now - 15 * 60e3) hist.shift();
  }
  drawChart(now);
  survTick(now);
}

/* ---------- Survival calculator: grid schedule for today + 2 days ---------- */
// Schedule: {"YYYY-MM-DD": [outage hours]} in localStorage; by default every hour has the grid.
// Simulation from the current SoC: an hour with the grid charges at SV.chg %/h (up to 100 %),
// an outage hour discharges at SV.dis %/h (down to 0 %). The current hour counts only its remaining part.
const SV = { soc: null, reserve: 0, chg: null, dis: null, why: '' };   // filled by tick()
let SCHED = {}, survAt = 0, survOk = false, survDirty = true, survPaint = null;
try { SCHED = JSON.parse(localStorage.getItem('victronSched') || '{}') || {}; } catch (e) {}
const dayOf = i => { const d = new Date(); d.setHours(0, 0, 0, 0); d.setDate(d.getDate() + i); return d; };
const dayKey = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
const isOff = (i, h) => (SCHED[dayKey(dayOf(i))] || []).includes(h);
function setOff(i, h, off) {
  const k = dayKey(dayOf(i)), a = (SCHED[k] || []).filter(x => x !== h);
  if (off) a.push(h);
  SCHED[k] = a.sort((x, y) => x - y);
  const today = dayKey(dayOf(0));
  for (const d in SCHED) if (d < today || !SCHED[d].length) delete SCHED[d];   // past days are dropped
  try { localStorage.setItem('victronSched', JSON.stringify(SCHED)); } catch (e) {}
  survDirty = true; survCalc();
}
function buildSurv() {
  const g = $('survGrid'), mk = (cls, txt) => { const e = document.createElement('div'); e.className = cls; if (txt) e.textContent = txt; g.append(e); return e; };
  mk('svh');
  for (let d = 0; d < 3; d++) mk('svh').id = 'svd' + d;
  for (let h = 0; h < 24; h++) {
    mk('svhr', String(h).padStart(2, '0'));
    for (let d = 0; d < 3; d++) { const c = mk('svc'); c.dataset.d = d; c.dataset.h = h; }
  }
  // click toggles an hour; dragging with the mouse paints the same value over the hours it passes
  const cell = e => { const c = e.target.closest && e.target.closest('.svc'); return c && !c.classList.contains('past') ? c : null; };
  g.addEventListener('pointerdown', e => {
    const c = cell(e); if (!c) return;
    if (e.pointerType === 'mouse') e.preventDefault();
    survPaint = !isOff(+c.dataset.d, +c.dataset.h); setOff(+c.dataset.d, +c.dataset.h, survPaint);
  });
  g.addEventListener('pointerover', e => {
    const c = cell(e); if (!c || survPaint === null || !(e.buttons & 1)) return;
    if (isOff(+c.dataset.d, +c.dataset.h) !== survPaint) setOff(+c.dataset.d, +c.dataset.h, survPaint);
  });
  document.addEventListener('pointerup', () => { survPaint = null; });
  document.addEventListener('pointercancel', () => { survPaint = null; });
  $('survClr').onclick = () => {
    if (!Object.keys(SCHED).length || !confirm(t('survClrAsk'))) return;
    SCHED = {}; try { localStorage.removeItem('victronSched'); } catch (e) {}
    survDirty = true; survCalc();
  };
}
// recompute on every schedule change (setOff), once a minute with fresh rates, and every tick until the rates are known
function survTick(now) { if (survDirty || !survOk || now - survAt >= 60e3) survCalc(); }
function survCalc() {
  const now = Date.now(), d0 = dayOf(0);
  const ok = SV.soc != null && SV.chg != null && SV.dis != null;
  survAt = now; survOk = ok; survDirty = false;
  const floor = Math.max(0, SV.reserve || 0), lvl = p => p > 60 ? 'ok' : p >= 40 ? 'warn' : 'bad';
  let soc = SV.soc, minP = soc, minAt = now, hitAt = null;
  for (let d = 0; d < 3; d++) {
    const day = dayOf(d);
    const dl = d === 0 ? t('survToday') : d === 1 ? t('survTomorrow')
      : day.toLocaleDateString(LOC(), { weekday: 'short', day: 'numeric', month: 'numeric' });
    $('svd' + d).textContent = dl;
    for (let h = 0; h < 24; h++) {
      const c = $('survGrid').querySelector(`.svc[data-d="${d}"][data-h="${h}"]`);
      // DST-safe hour bounds: built from calendar fields, not by adding 3600 s
      const t0 = new Date(d0.getFullYear(), d0.getMonth(), d0.getDate() + d, h).getTime();
      const t1 = new Date(d0.getFullYear(), d0.getMonth(), d0.getDate() + d, h + 1).getTime();
      const off = isOff(d, h), past = t1 <= now, cur = t0 <= now && now < t1;
      let cls = 'svc' + (off ? ' off' : '') + (past ? ' past' : '') + (cur ? ' cur' : ''), txt = '';
      c.title = `${dl} ${String(h).padStart(2, '0')}:00–${String((h + 1) % 24).padStart(2, '0')}:00 · ${t(off ? 'survOff' : 'survOn')}`;
      if (!past && ok) {
        const from = Math.max(t0, now), hrs = (t1 - from) / 3600e3;
        if (off) {
          const nx = soc - SV.dis * hrs;
          if (hitAt == null && nx <= floor && SV.dis > 0) hitAt = from + Math.max(0, soc - floor) / SV.dis * 3600e3;
          soc = Math.max(0, nx);
          if (soc < minP) { minP = soc; minAt = t1; }
        } else soc = Math.min(100, soc + SV.chg * hrs);
        txt = Math.round(soc) + '%'; cls += ' ' + lvl(soc);
        c.title += ` · ${Math.round(soc)} %`;
      } else if (!past) txt = '—';
      c.className = cls; c.textContent = txt;
    }
  }
  const sum = $('survSum'), at = ms => fmtAt(Math.max(0, ms - now) / 3600e3);
  if (!ok) { sum.textContent = SV.why || t('noData'); sum.className = 'survsum'; $('survRates').textContent = ''; return; }
  if (hitAt != null) { sum.textContent = t('survLow', { r: Math.round(floor), at: at(hitAt) }); sum.className = 'survsum bad'; }
  else { sum.textContent = t('survOk', { p: Math.round(minP), at: at(minAt) }); sum.className = 'survsum ' + lvl(minP); }
  $('survRates').textContent = t('survRates', { c: dc(SV.chg.toFixed(1)), d: dc(SV.dis.toFixed(1)),
    t: new Date(now).toLocaleTimeString(LOC(), { hour: '2-digit', minute: '2-digit' }) });
}

function drawChart(now) {
  const cv = $('chart'), dpr = window.devicePixelRatio || 1;
  const w = cv.clientWidth, h = cv.clientHeight;
  if (cv.width !== w * dpr || cv.height !== h * dpr) { cv.width = w * dpr; cv.height = h * dpr; }
  const g = cv.getContext('2d'); g.setTransform(dpr, 0, 0, dpr, 0, 0); g.clearRect(0, 0, w, h);
  const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
  const L = 52, R = w - 6, top = 8, bot = h - 18, span = 15 * 60e3;
  let max = 500; for (const p of hist) max = Math.max(max, Math.abs(p.p || 0), Math.abs(p.c || 0));
  max = Math.ceil(max * 1.1 / 500) * 500;
  const X = t => L + (R - L) * (1 - (now - t) / span), Y = v => top + (bot - top) * (max - v) / (2 * max);
  g.font = '11px system-ui'; g.fillStyle = css('--mut'); g.strokeStyle = css('--line'); g.lineWidth = 1;
  for (const v of [max, max / 2, 0, -max / 2, -max]) {
    g.beginPath(); g.moveTo(L, Y(v)); g.lineTo(R, Y(v)); g.stroke();
    g.fillText(fmtW(v), 2, Y(v) + 4);
  }
  for (const m of [15, 10, 5, 0]) g.fillText(m ? `−${m} ${t('uMin')}` : t('now'), Math.min(X(now - m * 60e3) - (m ? 16 : 34), R - 40), h - 3);
  if (hist.length < 2) return;
  const bw = Math.max(1, (R - L) / (span / 5000) - 0.5);
  for (const p of hist) {
    if (p.p == null) continue;
    g.fillStyle = p.p >= 0 ? css('--chg') : css('--dis');
    const y0 = Y(0), y1 = Y(p.p); g.fillRect(X(p.t) - bw, Math.min(y0, y1), bw, Math.abs(y1 - y0) || 1);
  }
  g.strokeStyle = css('--acc'); g.lineWidth = 2; g.beginPath(); let first = true;
  for (const p of hist) { if (p.c == null) continue; const x = X(p.t), y = Y(p.c); first ? g.moveTo(x, y) : g.lineTo(x, y); first = false; }
  g.stroke();
}

/* ---------- Demo mode (simulation) ---------- */
function startDemo() {
  setConn('wait', () => t('demoConn'));
  portalId = 'demo';
  const cap = 100, t0 = Date.now(); let soc = 72, kettleUntil = 0;
  Object.assign(S, { 'system/0/ActiveBatteryService': 'com.victronenergy.battery/512', 'battery/512/InstalledCapacity': cap,
    'settings/0/Settings/CGwacs/BatteryLife/MinimumSocLimit': 20,
    // limits are set once: in demo the Limits button changes them here
    'vebus/275/Dc/0/MaxChargeCurrent': 35, 'vebus/275/Ac/ActiveIn/CurrentLimit': 16, 'vebus/275/Ac/ActiveIn/CurrentLimitIsAdjustable': 1,
    'battery/512/Info/MaxChargeCurrent': 100, 'settings/0/Settings/SystemSetup/MaxChargeCurrent': 35,
    'settings/0/Settings/CGwacs/MaxChargePower': -1, 'system/0/Control/Dvcc': true });
  const step = () => {
    const t = (Date.now() - t0) / 1000;
    const gridOn = Math.floor(t / 90) % 2 === 1;           // 90 s with grid, 90 s without
    if (Math.random() < 0.01) kettleUntil = t + 20;
    let load = 450 + 250 * Math.sin(t / 23) + 80 * Math.random() + (t < kettleUntil ? 2000 : 0);
    const pv = Math.max(0, 600 * Math.sin(t / 60));
    const V = 48.5 + soc * 0.045;
    let batP, grid;
    if (gridOn) { batP = soc < 100 ? Math.min(35 * V, 1700) : 0; grid = load + batP - pv; }
    else { batP = -(load - pv) / 0.93; grid = 0; }
    soc = Math.max(0, Math.min(100, soc + batP / V / cap * 100 / 3600 * 20)); // sped up ×20
    Object.assign(S, {
      'system/0/Dc/Battery/Soc': soc, 'system/0/Dc/Battery/Voltage': V, 'system/0/Dc/Battery/Power': batP,
      'system/0/Dc/Battery/Current': batP / V, 'system/0/Dc/Battery/Temperature': 24,
      'system/0/Ac/Consumption/L1/Power': load, 'system/0/Ac/Grid/L1/Power': gridOn ? grid : null,
      'system/0/Dc/Pv/Power': pv, 'system/0/Ac/ActiveIn/Source': gridOn ? 1 : 240,
      'system/0/SystemState/State': gridOn ? (soc < 100 ? 3 : 8) : 9,
      'system/0/VebusInstance': 275, 'vebus/275/Ac/Out/NominalInverterPower': 2500, 'vebus/275/Ac/Out/P': load,
      'vebus/275/Alarms/Overload': load > 2500 ? 2 : load > 2300 ? 1 : 0,
    });
    lastMsg = Date.now();
  };
  step(); demoTimer = setInterval(step, 1000);
}

  sessionPw = $('fPw').value;
  // reconnect only if the connection settings changed
  if ([cfg.url, cfg.portal, cfg.user, sessionPw].join('\n') !== connBefore) { cfg.demo = false; saveCfg(); start(); }
  else saveCfg();
  survDirty = true; applyWall(); tick();
});

/* ---------- Limits: writing to the GX (W/<portal>/<path> {"value": x}) ---------- */
const P_IN = () => `vebus/${vebusInst()}/Ac/ActiveIn/CurrentLimit`;
const P_CHG = 'settings/0/Settings/SystemSetup/MaxChargeCurrent';
let pend = null;   // a sent write; waiting for the GX to publish the new value
const fA = v => v == null ? '—' : dc(Math.round(v * 10) / 10) + ' ' + t('uA');
let qClearAt = 0;
function ctlStatus(text, cls) {
  $('cStatus').textContent = text; $('cStatus').className = 'ctlst ' + (cls || '');
  $('qStatus').textContent = text; $('qStatus').className = 'sub ' + (cls || '');   // the same under the quick buttons
  qClearAt = text && cls ? Date.now() + 8000 : 0;
}
function writeGx(path, v, label, ask = true) {
  if (!portalId || (!cfg.demo && !mq)) { ctlStatus(t('noGx'), 'bad'); return; }
  if (!Number.isFinite(v)) { ctlStatus(t('enterNum'), 'bad'); return; }
  if (ask && !confirm(t('confirmWrite', { l: label }))) return;
  const before = num(S[path]);
  if (cfg.demo) setTimeout(() => { S[path] = v; }, 800);
  else mq.publish(`W/${portalId}/${path}`, JSON.stringify({ value: v }));
  pend = { path, v, before, label, at: Date.now() };
  ctlStatus(t('sent', { l: label }));
}
function ctlTick() {
  const vi = vebusInst();
  const inA = vi == null ? null : num(S[P_IN()]), adj = vi == null ? null : num(S[`vebus/${vi}/Ac/ActiveIn/CurrentLimitIsAdjustable`]);
  const chg = num(S[P_CHG]), dvcc = S['system/0/Control/Dvcc'];
  const chgT = chg == null ? '—' : chg < 0 ? t('noLimit') : fA(chg);
  $('btnCtl').textContent = cfg.wall ? '⚡' : t('ctlBtn', { in: fA(inA), chg: chgT });
  $('cInNow').textContent = inA == null ? '—' : t('nowInVal', { a: fA(inA), w: fmtW(inA * 230) });
  $('cChgNow').textContent = t('nowVal', { v: chgT });
  $('cInWarn').textContent = adj === 0 ? t('inFixed') : '';
  $('cChgWarn').textContent = dvcc === false || dvcc === 0 ? t('dvccOff') : '';
  // quick buttons in the charge card: highlight the current value, lock while a write is pending
  document.querySelectorAll('[data-q]').forEach(b => {
    b.classList.toggle('on', inA != null && Math.abs(inA - +b.dataset.q) < 0.05);
    b.disabled = !!pend || adj === 0;
  });
  document.querySelectorAll('[data-qc]').forEach(b => {
    b.classList.toggle('on', chg != null && Math.abs(chg - +b.dataset.qc) < 0.05);
    b.disabled = !!pend || dvcc === false || dvcc === 0;
    b.title = dvcc === false || dvcc === 0 ? t('dvccOff') : '';
  });
  if (qClearAt && Date.now() > qClearAt) { $('qStatus').textContent = ''; qClearAt = 0; }
  if (pend) {
    const cur = num(S[pend.path]);
    if (cur != null && Math.abs(cur - pend.v) < 0.05) { ctlStatus(t('applied', { l: pend.label }), 'ok'); pend = null; }
    else if (Date.now() - pend.at > 15000) {
      ctlStatus(cur != null && cur !== pend.before ? t('clamped', { v: fA(cur) }) : t('notConfirmed', { v: fA(cur) }), cur !== pend.before ? '' : 'bad');
      pend = null;
    }
  }
}
$('btnCtl').onclick = () => {
  $('cIn').value = num(S[P_IN()]) ?? ''; const c = num(S[P_CHG]); $('cChg').value = c != null && c >= 0 ? c : '';
  if (!pend) ctlStatus(''); ctlTick(); $('ctl').showModal();
};
// input quick buttons: write right away, without asking (safe values, easy to undo)
// charge current quick buttons (DVCC limit): also without asking
document.querySelectorAll('[data-qc]').forEach(b => b.onclick = () => {
  const v = +b.dataset.qc;
  if (Math.abs((num(S[P_CHG]) ?? -99) - v) < 0.05) return;
  writeGx(P_CHG, v, t('lblChg', { a: fA(v), w: fmtW(v * NOM_V) }), false); ctlTick();
});
document.querySelectorAll('[data-q]').forEach(b => b.onclick = () => {
  const v = +b.dataset.q;
  if (Math.abs((num(S[P_IN()]) ?? -1) - v) < 0.05) return;
  writeGx(P_IN(), v, t('lblIn', { a: fA(v), w: fmtW(v * 230) }), false); ctlTick();
});
document.querySelectorAll('[data-in]').forEach(b => b.onclick = () => { $('cIn').value = b.dataset.in; });
document.querySelectorAll('[data-chg]').forEach(b => b.onclick = () => {
  if (+b.dataset.chg < 0) writeGx(P_CHG, -1, t('lblChgOff')); else $('cChg').value = b.dataset.chg;
});
$('cInApply').onclick = () => {
  const v = Math.round(parseFloat($('cIn').value) * 10) / 10;
  if (!(v >= 1 && v <= 50)) { ctlStatus(t('rangeIn'), 'bad'); return; }
  writeGx(P_IN(), v, t('lblIn', { a: fA(v), w: fmtW(v * 230) }));
};
$('cChgApply').onclick = () => {
  const v = Math.round(parseFloat($('cChg').value));
  if (!(v >= 0 && v <= 500)) { ctlStatus(t('rangeChg'), 'bad'); return; }
  writeGx(P_CHG, v, v === 0 ? t('lblChgZero') : t('lblChg', { a: fA(v), w: fmtW(v * NOM_V) }));
};
// quick buttons from settings: max on top, the average in the middle, min at the bottom.
// Input is rounded to 0.5 A, charge to 1 A; if min > max, they are swapped.
function quickVals(lo, hi, step, min, max) {
  const r = x => Math.round(x / step) * step, c = x => Math.min(max, Math.max(min, r(+x)));
  let a = c(lo), b = c(hi); if (a > b) [a, b] = [b, a];
  return [b, r((a + b) / 2), a];
}
function applyQuick() {
  const qi = quickVals(cfg.qInMin, cfg.qInMax, 0.5, 1, 50), qc = quickVals(cfg.qChgMin, cfg.qChgMax, 1, 0, 500);
  document.querySelectorAll('[data-q]').forEach((b, i) => { b.dataset.q = qi[i]; });
  document.querySelectorAll('[data-qc]').forEach((b, i) => { b.dataset.qc = qc[i]; });
}
// language switch: texts change at once, the choice is remembered
$('selLang').onchange = () => {
  cfg.lang = $('selLang').value; LI = Math.max(0, LANGS.indexOf(cfg.lang)); saveCfg();
  survDirty = true; applyLang(); applyWall(); tick(); ctlTick();
  if (connFn) $('connText').textContent = connFn();
};
setInterval(ctlTick, 1000);

applyQuick();
buildSurv();
applyLang();
applyWall();
if (cfg.snd) audio();   // in a kiosk browser with autoplay allowed, sound works right away
start();
setInterval(tick, 1000);
tick();
</script>
</body>
</html>
